<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --red:#CA101B; --error:#D92D20; --ok:#12B76A;
    --bg:#F5F5F6; --card:#FFFFFF; --text:#141414; --en:#4A4F57; --muted:#5E636B; --line:#D9DBDF; --mark:#9AA0A8;
    --accent:#CA101B; --accent-soft:#FDEEEF; --primary:#141414; --primary-text:#FFFFFF;
    --chip-bg:#ECEDEF; --chip-text:#3A3F46;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.4;min-height:100vh;min-height:100dvh;font-size:17px;
    word-break:keep-all;overflow-wrap:break-word;
  }
  .topbar{background:#fff;border-bottom:2px solid var(--red);padding:calc(env(safe-area-inset-top) + 9px) 18px 8px;
    display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.3px}
  .topbar img{height:22px;display:block}
  .wrap{max-width:520px;margin:0 auto;padding:14px 18px 92px}
  .screen{animation:in .22s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .en{display:block;color:var(--en);font-weight:500}
  h1{font-size:30px;line-height:1.28;margin:0 0 14px;letter-spacing:-.8px}
  h1 .en{font-size:18px;margin-top:6px;letter-spacing:0}
  h2{font-size:22px;line-height:1.32;margin:8px 0 12px;letter-spacing:-.4px;font-weight:800}
  h2 .en{font-size:16px;margin-top:3px;letter-spacing:0;font-weight:500}
  .desc{color:var(--muted);margin:-4px 0 12px;font-size:15px}
  .chip{display:inline-block;background:var(--chip-bg);color:var(--chip-text);font-size:14px;font-weight:700;padding:4px 11px;border-radius:999px}
  .staff{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:16px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}

  /* 시작 화면 */
  .hero{padding:calc(env(safe-area-inset-top) + 34px) 24px 20px}
  .hero .logo{height:34px;display:block;margin-bottom:30px}
  .eyebrow{display:inline-block;font-size:14px;font-weight:800;letter-spacing:1px;color:var(--accent);margin-bottom:10px}
  .tagline{font-size:17px;font-weight:600;margin:0;padding-top:14px;border-top:2px solid var(--accent);display:inline-block}
  .tagline .en{font-size:14.5px;margin-top:2px}
  .wbody{padding:0 24px 150px}
  .agree{font-size:14px;color:var(--muted);text-align:center;margin:0 0 10px}
  .agree a{color:var(--text);font-weight:700;text-decoration:underline;cursor:pointer}

  /* 입력칸 */
  .field{margin-bottom:10px}
  .field label{display:block;font-size:16px;font-weight:700;margin-bottom:5px}
  .field label .en{display:inline;font-size:14px;margin-left:6px}
  .field label small{font-weight:600;color:var(--muted);font-size:13px;margin-left:6px}
  .field input,.field textarea{width:100%;font:inherit;font-size:18px;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none}
  .field input::placeholder,.field textarea::placeholder{color:var(--mark)}
  .field textarea{min-height:64px;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field.has-error input{border-color:var(--error)}
  .err{color:var(--error);font-size:14px;font-weight:600;margin-top:4px}
  .err:empty{display:none}

  /* 명함 / 직접입력 선택 */
  .one{display:flex;align-items:center;gap:10px;background:#FFF7E6;border:2px solid #F5C77A;color:#7A4B00;border-radius:12px;padding:10px 14px;font-size:17px;font-weight:800;margin:4px 0 14px}
  .one .en{display:inline;color:#7A4B00;font-size:14px;margin-left:4px;font-weight:600}
  .bigcard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 16px;cursor:pointer}
  .bigcard.main{border-color:var(--text)}
  .bigcard .ic{width:54px;height:54px;border-radius:14px;background:var(--chip-bg);display:grid;place-items:center;flex:none}
  .bigcard.main .ic{background:var(--text)}
  .bigcard .ic svg{width:30px;height:30px}
  .bigcard .t{font-size:21px;font-weight:800;line-height:1.25}
  .bigcard .t .en{font-size:15px;margin-top:2px}
  .bigcard .badge2{display:inline-block;margin-top:6px;background:var(--accent);color:#fff;font-size:13px;font-weight:800;padding:3px 9px;border-radius:999px}
  .bigcard input{display:none}
  .or{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:800;font-size:15px;margin:12px 4px}
  .or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
  .cardprev{width:100%;max-height:300px;object-fit:contain;border-radius:14px;border:2px solid var(--line);background:#fff;display:block;margin-bottom:12px}
  .okline{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:#067647;margin-bottom:10px}

  /* 보기 버튼 */
  .hint{font-size:14px;color:var(--muted);margin:-6px 0 10px;font-weight:600}
  .hint.warn{color:var(--error)}
  .options{display:flex;flex-direction:column;gap:8px}
  .opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);cursor:pointer;min-height:56px}
  .opt .ko{font-size:18px;font-weight:600;line-height:1.3}
  .opt .en{font-size:14.5px;line-height:1.3;margin-top:1px}
  .opt .txt{display:flex;flex-direction:column;min-width:0;flex:1}
  .opt .mark{width:24px;height:24px;border:2px solid var(--mark);flex:none;display:grid;place-items:center;background:var(--card)}
  .opt[data-kind=single] .mark{border-radius:50%}
  .opt[data-kind=multi] .mark{border-radius:6px}
  .opt.on{border-color:var(--accent);background:var(--accent-soft)}
  .opt.on .mark{border-color:var(--accent);background:var(--accent)}
  .opt.on .mark::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .options.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid2 .opt{padding:9px 10px;gap:8px;min-height:60px;align-items:flex-start;border-radius:12px}
  .grid2 .opt .mark{width:21px;height:21px;margin-top:2px}
  .grid2 .opt .ko{font-size:16px}
  .grid2 .opt .en{font-size:13px}
  .opt .info{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mark);color:var(--muted);font:800 15px/24px Georgia,serif;font-style:italic;text-align:center;background:#fff}
  .grid2 .opt .info{position:absolute;right:6px;bottom:6px;width:24px;height:24px;font-size:13px;line-height:20px}
  .grid2 .opt.has-info .txt{padding-right:20px}
  .other-input{margin-top:10px}

  /* 설명 창 */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:22px 22px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease}
  @keyframes up{from{transform:translateY(40px)}to{transform:none}}
  .sheet h3{margin:0 0 10px;font-size:22px}
  .sheet p{margin:0 0 6px;font-size:17px;line-height:1.5}
  .sheet p.en{font-size:15px;color:var(--en);margin-bottom:18px}
  .sheet .btn{width:100%}

  /* 아래 버튼 */
  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 75%,transparent);padding:16px 18px calc(env(safe-area-inset-bottom) + 14px)}
  .bar .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
  .bar.wb{background:linear-gradient(to top,var(--bg) 85%,transparent)}
  .bar .stack{max-width:520px;margin:0 auto}
  .btn{font:inherit;font-size:19px;font-weight:800;border:0;border-radius:14px;padding:15px 10px;cursor:pointer;line-height:1.1}
  .btn .en{display:inline;font-size:15px;font-weight:600;color:inherit;opacity:.8;margin-left:5px}
  .btn:active{transform:scale(.98)}
  .btn.primary{flex:1;background:var(--primary);color:var(--primary-text)}
  .btn.primary:disabled{opacity:.3}
  .btn.ghost{background:var(--card);color:var(--text);border:2px solid var(--line);min-width:108px}
  .btn.full{width:100%}

  .center{text-align:center;padding-top:36px}
  .center .staff{justify-content:center;margin-top:8px}
  .ok-icon{width:76px;height:76px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 18px}
  .ok-icon svg{width:38px;height:38px}
  .lead{font-size:17px;margin:0 0 6px}

  function shrink(file) {

  function formatPhone(v) {
    if (/^\s*\+/.test(v)) return v.replace(/[^\d+\s-]/g, '');

        <div class="field" id="f-${f.id}"><label for="in-${f.id}">${esc(f.label)}${enSpan(f.en)}${f.required ? '' : '<small>(선택 · optional)</small>'}</label>
          <input id="in-${f.id}" ${f.type === 'tel' ? 'type="tel" inputmode="tel" placeholder="010-0000-0000 / +82 …"' : f.type === 'email' ? 'type="email" inputmode="email"' : ''}
            ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} ${f.ac ? `autocomplete="${f.ac}"` : ''} value="${esc(info[f.id] || '')}"><div class="err"></div></div>`).join('')}`,
      `<button class="btn ghost" id="prev">${btnLabel(T.back)}</button><button class="btn primary" id="next">${btnLabel(T.next)}</button>`);
    const phone = document.getElementById('in-phone');
    phone.addEventListener('input', () => { phone.value = formatPhone(phone.value); });
    document.getElementById('prev').onclick = () => history.back();
    document.getElementById('next').onclick = () => {
      TYPE_FIELDS.forEach(f => info[f.id] = document.getElementById('in-' + f.id).value.trim());
      const errs = {};
      TYPE_FIELDS.forEach(f => errs[f.id] = f.required && !info[f.id] ? '꼭 입력해 주세요 · Required' : '');
      const dg = (info.phone || '').replace(/\D/g, '');
      if (info.phone && (dg.length < 8 || dg.length > 15)) errs.phone = '번호를 확인해 주세요 · Please check';
      if (info.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(info.email)) errs.email = 'E-mail을 확인해 주세요 · Please check';
      let first = null;
      Object.entries(errs).forEach(([k, m]) => { const b = document.getElementById('f-' + k); b.classList.toggle('has-error', !!m); b.querySelector('.err').textContent = m; if (m && !first) first = b; });
      if (!first) next(idx);
    };
  }

  /* ----- 설명 창 (ⓘ) ----- */
  function openSheet(key, title) {
    closeSheet();
    const d = INFO[key]; if (!d) return;
    const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheetBg';
    bg.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3><p>${esc(d[0])}</p><p class="en">${esc(d[1])}</p>
      <button class="btn primary" id="sheetClose">확인<span class="en">OK</span></button></div>`;
    bg.onclick = e => { if (e.target === bg || e.target.closest('#sheetClose')) closeSheet(); };
    document.body.appendChild(bg);
  }
  function closeSheet() { const b = document.getElementById('sheetBg'); if (b) b.remove(); }

  /* ----- 보기 문항 ----- */
  function prefill(q) {
    const a = state.answers[q.id];
    if (a.touched) return;
    const pre = new Set();
    QUESTIONS.filter(x => x.usage).forEach(u => state.answers[u.id].selected.forEach(k => (u.options[k].pre || []).forEach(p => pre.add(p))));
    a.selected = q.options.map((o, k) => pre.has(o.key) ? k : -1).filter(k => k > -1);
  }
  function countWith(q) {
    const c = qq => state.answers[qq.id].selected.filter(k => !qq.options[k].none).length;
    return c(q) + (q.maxWith ? c(Q(q.maxWith)) : 0);
  }

  function renderQuestion(idx) {
    const q = QUESTIONS[idx];
    if (q.type === 'contact') return renderContact(idx);
    if (q.type === 'cardOk') return renderCardOk(idx);
    if (q.type === 'typing') return renderTyping(idx);
    const a = state.answers[q.id];
    if (q.prefill) prefill(q);
    const last = nextStep(idx) === null;
    const kind = q.multi ? 'multi' : 'single';
    const grid = q.options.length > 5 || q.freeText;
    const hint = q.hintText || (q.multi ? '여러 개 고를 수 있어요 · Choose all that apply' : '');
    shell(`
      <span class="chip">${esc(q.cat[0])} · ${esc(q.cat[1])}</span>
      <h2>${esc(q.title[0])}<span class="en">${esc(q.title[1])}</span></h2>
      ${q.desc ? `<p class="desc">${esc(q.desc)}</p>` : ''}
      ${hint ? `<p class="hint" id="hint">${esc(hint)}</p>` : ''}
      <div class="options ${grid ? 'grid2' : ''}">
        ${q.options.map((o, k) => `
          <button class="opt ${a.selected.includes(k) ? 'on' : ''} ${INFO[o.key] && q.prefill ? 'has-info' : ''}" data-k="${k}" data-kind="${kind}" role="${q.multi ? 'checkbox' : 'radio'}" aria-checked="${a.selected.includes(k)}">
            <span class="mark"></span><span class="txt"><span class="ko">${esc(o.ko || o.label)}</span>${enSpan(o.en)}</span>
            ${INFO[o.key] && q.prefill ? `<span class="info" data-info="${o.key}" aria-label="설명">i</span>` : ''}
          </button>`).join('')}
      </div>
      ${q.freeText ? `<div class="field other-input"><label for="free">하실 말씀 <small>(선택 · optional)</small></label><textarea id="free" placeholder="자유롭게 · Feel free to write">${esc(a.free)}</textarea></div>` : ''}`,
      `<button class="btn ghost" id="prev">${btnLabel(T.back)}</button><button class="btn primary" id="next"></button>`);

    const nextBtn = document.getElementById('next');
    const refresh = () => {
      const ok = a.selected.length > 0 || (q.freeText && a.free.trim());
      const req = q.required || (q.requiredIfEmpty && !state.answers[q.requiredIfEmpty].selected.length);
      nextBtn.disabled = req && !ok;
      nextBtn.innerHTML = btnLabel(last ? T.submit : (req || ok ? T.next : T.skip));
    };
    const paint = () => app.querySelectorAll('.opt').forEach(b => {
      const on = a.selected.includes(+b.dataset.k); b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
    });
    app.querySelectorAll('.opt').forEach(btn => btn.onclick = e => {
      const k = +btn.dataset.k, o = q.options[k];
      const info = e.target.closest('.info');
      if (info) { openSheet(info.dataset.info, o.ko || o.label); return; }
      a.touched = true;
      if (q.usage) { state.answers.product.touched = false; state.answers.product2.touched = false; }
      if (!q.multi) a.selected = [k];
      else if (a.selected.includes(k)) a.selected = a.selected.filter(x => x !== k);
      else if (o.none) a.selected = [k];
      else {
        if (q.max && countWith(q) >= q.max) {
          const h = document.getElementById('hint'); if (h) { h.classList.add('warn'); setTimeout(() => h.classList.remove('warn'), 1500); }
          return;
        }
        a.selected = [...a.selected.filter(x => !q.options[x].none), k];
      }
      paint(); refresh();
      if (!q.multi) setTimeout(() => { if (state.step === idx + 1) next(idx); }, 230);
    });
    const free = document.getElementById('free');
    if (free) free.addEventListener('input', () => { a.free = free.value; refresh(); });
    refresh();
    document.getElementById('prev').onclick = () => history.back();
    nextBtn.onclick = () => { if (!nextBtn.disabled) next(idx); };
  }

  /* ----- 결과 만들기 (삼전용 / 간토용, 한국어로 저장) ----- */
  function labels(q, Tg) {
    const a = state.answers[q.id], out = [];
    a.selected.slice().sort((x, y) => x - y).forEach(k => {
      const o = q.options[k];
      if (o.only && o.only !== Tg) return;
      const l = typeof o[Tg] === 'string' ? o[Tg] : o.label;
      if (!out.includes(l)) out.push(l);
    });
    return out;
  }
  function put(out, col, val) {
    if (!(col in out) || !out[col]) out[col] = val;
    else if (val) out[col] += ', ' + val;
  }
  function buildFor(Tg) {
    const out = {};
    if (Tg === 'S') {
      Object.assign(out, {
        '응대자': staff ? `${staff.name} ${staff.title}` : '미지정',
        '연락처 방식': state.mode === 'card' ? '명함 사진' : '직접 입력',
        '회사명': state.info.company || '', '성명': state.info.name || '', '연락처': state.info.phone || '',
        'E-mail': state.info.email || '', '명함 사진': '', '직책': '', '사업장 지역': ''
      });
    }
    QUESTIONS.forEach(q => {
      if (!q.options) return;
      const vis = qVisible(q), a = state.answers[q.id];
      if (q.usageCol && Tg === 'S') {
        const p = (out[q.usageCol] || '').split(', ').filter(Boolean);
        a.selected.forEach(k => { const v = q.options[k].purpose; if (v && !p.includes(v)) p.push(v); });
        out[q.usageCol] = p.join(', ');
      }
      if (q[Tg]) put(out, q[Tg], vis ? labels(q, Tg).join(', ') : '');
      if (Tg === 'K' && q.kFlag) out[q.kFlag] = !a.selected.length ? '' : (labels(q, 'K').length ? '예' : '아니오');
      if (q.freeText && a.free.trim() && q[Tg]) put(out, q[Tg], '의견: ' + a.free.trim());
    });
    if (Tg === 'S') {
      const consult = state.answers.usage2.selected.some(k => Q('usage2').options[k].consult);
      out['상담 필요'] = consult ? 'Y' : '';
      out['개인정보 수집·이용 동의'] = state.consent ? 'Y' : 'N';
    }
    return out;
  }
  window.__buildFor = buildFor;

  function submit() {
    send({ sid: state.sid, samchun: buildFor('S'), kanto: buildFor('K'), card: state.mode === 'card' ? state.card : '' });
  }
  function renderSending() { shell(`<div class="center"><div class="spinner"></div><h2>제출 중입니다<span class="en">Submitting…</span></h2></div>`, ''); }
  function renderDone() {
    shell(`<div class="center">
      <div class="ok-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1 style="font-size:26px">설문이 제출되었습니다<span class="en">Your survey has been submitted</span></h1>
      <p class="lead">소중한 의견 감사합니다.<br>빠른 시일 내에 연락드리겠습니다.</p>
      <p class="lead en">Thank you. We will contact you soon.</p>
      ${staff ? `<div class="staff"><span class="dot"></span><span>담당 · Contact <b>${esc(staff.name)} ${esc(staff.title)}</b></span></div>` : ''}
      <img src="${LOGO.color}" alt="SAMCHUN" style="height:24px;margin:20px auto 6px;display:block">
      <p class="desc">${esc(CONFIG.COMPANY)} · ${esc(CONFIG.COMPANY_EN)}</p>
      ${DEMO ? '<span class="badge">테스트 모드 · 저장되지 않음</span>' : ''}
    </div>`, '');
  }
  function renderFail(payload) {
    shell(`<div class="center"><h2>전송에 실패했습니다<span class="en">Could not send</span></h2>
      <p class="desc">인터넷 연결을 확인한 뒤 다시 눌러 주세요.<br>Please check your connection and try again.</p></div>`,
      `<button class="btn primary" id="retry">다시 전송<span class="en">Retry</span></button>`);
    document.getElementById('retry').onclick = () => send(payload);
  }
  async function send(payload) {
    renderSending();
    if (DEMO) {
      console.log('[테스트 모드] 삼전용', JSON.stringify(payload.samchun));
      console.log('[테스트 모드] 간토용', JSON.stringify(payload.kanto));
      console.log('[테스트 모드] 명함', payload.card ? payload.card.length + ' bytes' : '없음');
      await new Promise(r => setTimeout(r, 500)); return finish();
    }
    for (let i = 0; i < 3; i++) {
      try {
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
        return finish();
      } catch (e) { await new Promise(r => setTimeout(r, 1500)); }
    }
    renderFail(payload);
  }
  function finish() { state.submitted = true; history.pushState({ step: -1 }, ''); renderDone(); }

  go(0, false);

  /* ----- QR 관리 화면 (주소 뒤에 ?qr) ----- */
  function renderQRAdmin() {
    const base = location.origin + location.pathname.replace(/index\.html$/, '');
    app.innerHTML = `
      <div class="topbar"><img src="${LOGO.color}" alt="SAMCHUN"><span>${esc(CONFIG.EVENT)} · QR</span></div>
      <main class="qr-wrap">
        <div class="qr-head"><h1>부스 인원별 설문 QR</h1><button class="btn primary small" id="dlAll">전체 다운로드</button></div>
        ${location.protocol === 'file:' ? `<div class="note warn">내 컴퓨터에서 연 파일이라 이 QR은 쓸 수 없습니다. 인터넷에 올린 주소에서 다시 열어 주세요.</div>` : ''}
        ${DEMO ? `<div class="note warn">아직 저장 주소(SCRIPT_URL)가 비어 있어 테스트 모드입니다.</div>` : ''}
        <div class="note">각자 본인 QR 이미지를 휴대폰에 저장해 두세요. 휴대폰에서는 이미지를 길게 눌러 저장할 수 있습니다.<br>QR 주소: <b>${esc(base)}?s=번호</b></div>
        <div class="grid" id="grid"></div>
      </main>`;
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = async () => {
      try { await document.fonts.ready; } catch (e) {}
      await new Promise(r => { logoImg.onload = r; logoImg.onerror = r; logoImg.src = LOGO.color; });
      const grid = document.getElementById('grid');
      STAFF.forEach(st => {
        const url = `${base}?s=${st.code}`, png = makeCard(st, url), file = `SEDEX_QR_${st.code}_${st.name}.png`;
        const el = document.createElement('div'); el.className = 'qcard';
        el.innerHTML = `<img src="${png}" alt="${esc(st.name)} QR"><div class="row"><a class="dl" href="${png}" download="${esc(file)}">다운로드</a><a href="${esc(url)}" target="_blank" rel="noopener">열어보기</a></div>`;
        el.dataset.file = file; el.dataset.png = png; grid.appendChild(el);
      });
      document.getElementById('dlAll').onclick = async () => {
        for (const c of grid.querySelectorAll('.qcard')) {
          const a = document.createElement('a'); a.href = c.dataset.png; a.download = c.dataset.file;
          document.body.appendChild(a); a.click(); a.remove(); await new Promise(r => setTimeout(r, 400));
        }
      };
    };
    s.onerror = () => { document.getElementById('grid').innerHTML = '<div class="note warn">QR 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</div>'; };
    document.head.appendChild(s);
  }
  const logoImg = new Image();
  function makeCard(st, url) {
    const W = 1080, H = 1440, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    const font = '"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, W, H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (logoImg.width) { const lw = 560, lh = lw * logoImg.height / logoImg.width; g.drawImage(logoImg, (W - lw) / 2, 70, lw, lh); }
    g.fillStyle = '#CA101B'; g.fillRect(W / 2 - 60, 196, 120, 6);
    g.fillStyle = '#4A4F57'; g.font = `700 36px ${font}`; g.fillText(`${CONFIG.EVENT} · VISITOR SURVEY`, W / 2, 250);
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const n = qr.getModuleCount(), cell = Math.floor(680 / n), size = cell * n;
    const x0 = Math.round((W - size) / 2), y0 = 320 + Math.round((680 - size) / 2);
    g.fillStyle = '#111827';
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (qr.isDark(r, col)) g.fillRect(x0 + col * cell, y0 + r * cell, cell, cell);
    g.fillStyle = '#111827'; g.font = `800 76px ${font}`; g.fillText(`${st.name} ${st.title}`, W / 2, 1110);
    g.fillStyle = '#475467'; g.font = `600 38px ${font}`; g.fillText('카메라로 QR을 찍어 설문에 참여해 주세요', W / 2, 1200);
    g.font = `500 34px ${font}`; g.fillText('Scan the QR code to take our survey', W / 2, 1255);
    g.fillStyle = '#D5DBE5'; g.fillRect(140, 1330, W - 280, 2);
    g.fillStyle = '#98A2B3'; g.font = `500 28px ${font}`; g.fillText(`No.${st.code}`, W / 2, 1380);
    return c.toDataURL('image/png');
  }
})();
</script>
